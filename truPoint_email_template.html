
<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Email – návštěva závodu</title>
  <style>
    body { 
      margin:0; padding:0; background:#f4f6f8;
    }
    table { 
      border-collapse:collapse; 
    }
    img { 
      display:block; border:0; max-width:100%; height:auto; box-shadow: 5px 5px 10px 2px rgba(0, 0, 0, 0.3); 
    }
    .wrapper { 
      width:100%; padding:24px 0; background:#f4f6f8; 
    }
    .container { 
      width:100%; max-width:640px; margin:0 auto; background:#ffffff; border-radius:10px; overflow:hidden; box-shadow:0 2px 10px rgba(0,0,0,.08); 
    }
    .header img { 
      width:100%; 
    }
    .content { 
      padding:28px; font-family:"Noto Sans", Arial, sans-serif; color:#1f2937; 
    }
    h1 { 
      margin:0 0 12px; font-size:20px; color:#0f172a; 
    }
    p { 
      margin:0 0 14px; font-size:14px; line-height:1.6; 
    }
    .info { 
      background:#f9fafb; border-left:4px solid #00893D; padding:14px 16px; margin:20px 0; 
    }
    .footer { 
      padding:18px 28px 26px; font-family:"Noto Sans", Arial, sans-serif; font-size:12px; color:#6b7280; text-align:center; background:#f9fafb; 
    }
    .badge { 
      display:inline-block; margin-top:10px; padding:4px 10px; border-radius:12px; background:#e5e7eb; color:#374151; font-size:11px; 
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <table role="presentation" class="container" width="100%">
      <tr>
        <td class="header">
          <!-- Úvodní obrázek -->
          <img src="https://marketing-portal.schaeffler/__image/a/1334182/alias/xl/k/93586eb4dcea17d25d977de0d6e2e1fe257f168b/ar/flexible/fn/CES%20Schaeffler%20booth%20visualization%202026.jpg" alt="Návštěva závodu">
        </td>
      </tr>
      <tr>
        <td class="content">
          <!-- Nadpis -->
          <h1>{1}</h1>

          <!-- Hlavní text -->
           <div>
              <p>{0}</p>
           </div>
          
        </td>
      </tr>
      <tr>
        <td class="footer">
          <p>This email is generated by truPOINT system. Please do not reply.</p>
          <p>Thank you for your attention.</p>
          <span class="badge">Internal</span>
        </td>
      </tr>
    </table>
  </div>
</body>
</html>
